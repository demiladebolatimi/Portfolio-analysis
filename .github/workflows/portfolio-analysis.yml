name: Portfolio Analysis

on:
  schedule:
    # Run weekdays at 9:00 AM Eastern Time
    - cron: '0 13 * * 1-5'  # 9 AM ET = 1 PM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run portfolio analysis
      env:
        GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      run: |
        python portfolio_analysis.py
    
    - name: Upload charts as artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: portfolio-charts
        path: |
          portfolio_comparison.png
          sell_likelihood_tracking.png
          sell_likelihood_heatmap.png
          buy_likelihood_heatmap.png
        retention-days: 30
